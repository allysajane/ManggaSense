<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ManggaSense | Mango Grading Records</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Georgia, 'Times New Roman', serif;
        }

        body {
            min-height: 100vh;
            padding: 35px 15px;
            background: linear-gradient(135deg, #a6e6cf, #efed7b);
            color: #245F58;
        }

        .container {
            max-width: 1150px;
            margin: auto;
            padding: 35px;
            background: white;
            border: 2px solid #D6EAE1;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(40, 109, 99, 0.12);
        }

        .back-button {
            display: inline-block;
            margin-bottom: 22px;
            color: #286D63;
            text-decoration: none;
            font-weight: bold;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            color: #286D63;
            font-size: 30px;
            margin-bottom: 8px;
        }

        header p {
            color: #619C8D;
        }

        .top-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .top-section h2 {
            color: #286D63;
            font-size: 21px;
        }

        .add-button {
            padding: 11px 18px;
            border-radius: 9px;
            background: #619C8D;
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .add-button:hover {
            background: #4F887A;
        }

        .table-container {
            overflow-x: auto;
            border: 1px solid #D6EAE1;
            border-radius: 12px;
        }

        table {
            width: 100%;
            min-width: 900px;
            border-collapse: collapse;
        }

        th {
            padding: 15px;
            background: #BFE5D8;
            color: #245F58;
            text-align: left;
            white-space: nowrap;
        }

        td {
            padding: 14px 15px;
            border-bottom: 1px solid #E2F0EA;
            font-size: 14px;
        }

        tr:hover {
            background: #F4FAF7;
        }

        .grade {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: bold;
            background: #EAF7F1;
            color: #286D63;
            white-space: nowrap;
        }

        .empty-message {
            text-align: center;
            padding: 35px;
            color: #619C8D;
        }

        #message {
            text-align: center;
            margin: 20px 0;
            font-weight: bold;
        }

        .refresh-button {
            padding: 10px 18px;
            border: none;
            border-radius: 9px;
            background: #A9DCCB;
            color: #245F58;
            font-weight: bold;
            cursor: pointer;
        }

        .refresh-button:hover {
            background: #8BBDB0;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <a href="/dashboard.html" class="back-button">
            ← Back to Dashboard
        </a>

        <header>
            <h1>Mango Grading Records</h1>
            <p>View and monitor your previously graded mangoes.</p>
        </header>

        <div class="top-section">
            <h2>Grading History</h2>

            <div>
                <button
                    class="refresh-button"
                    onclick="loadRecords()">
                    Refresh Records
                </button>

                <a href="/mango-grading.html" class="add-button">
                    + New Grading
                </a>
            </div>
        </div>

        <p id="message">Loading grading records...</p>

        <div class="table-container">

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Mango Variety</th>
                        <th>Weight (g)</th>
                        <th>Maturity</th>
                        <th>Skin Color</th>
                        <th>Defects</th>
                        <th>Quality Grade</th>
                        <th>Date Recorded</th>
                    </tr>
                </thead>

                <tbody id="recordsTable">
                    <tr>
                        <td colspan="8" class="empty-message">
                            Loading records...
                        </td>
                    </tr>
                </tbody>
            </table>

        </div>

    </div>

    <script>

        async function loadRecords() {

            const table = document.getElementById("recordsTable");
            const message = document.getElementById("message");

            message.textContent = "Loading grading records...";

            table.innerHTML = `
                <tr>
                    <td colspan="8" class="empty-message">
                        Loading records...
                    </td>
                </tr>
            `;

            try {

                const response = await fetch("/api/mango-grading");

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(
                        result.message || "Unable to retrieve records."
                    );
                }

                table.innerHTML = "";

                if (result.records.length === 0) {

                    table.innerHTML = `
                        <tr>
                            <td colspan="8" class="empty-message">
                                No mango grading records found.
                            </td>
                        </tr>
                    `;

                    message.textContent = "No records available.";
                    return;
                }

                result.records.forEach(record => {

                    const row = document.createElement("tr");

                    const values = [
                        record.id,
                        record.mango_variety,
                        record.weight,
                        record.maturity_level,
                        record.skin_color,
                        record.defects || "None",
                        record.quality_grade,
                        record.created_at
                    ];

                    values.forEach((value, index) => {

                        const cell = document.createElement("td");

                        if (index === 6) {

                            const grade = document.createElement("span");
                            grade.className = "grade";
                            grade.textContent = value;

                            cell.appendChild(grade);

                        } else {

                            cell.textContent = value ?? "—";

                        }

                        row.appendChild(cell);

                    });

                    table.appendChild(row);

                });

                message.textContent =
                    `Total grading records: ${result.records.length}`;

            } catch (error) {

                console.error(error);

                message.textContent = error.message;

                table.innerHTML = `
                    <tr>
                        <td colspan="8" class="empty-message">
                            Unable to load grading records.
                        </td>
                    </tr>
                `;

            }

        }

        loadRecords();

    </script>

</body>
</html>
